services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16
    restart: always
    ports:
      - '6000:6000'

    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sayarati
      POSTGRES_PASSWORD: sayarati
      POSTGRES_DB: sayarati
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
    driver: local
